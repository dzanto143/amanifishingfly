  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       IMAGE UPLOAD
    ===================================================== */

    .upload-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 12px 0 6px;
      color: var(--ink);
    }

    .image-options {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .upload-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px dashed var(--green2);
      border-radius: 9px;
      background: #f5f8f4;
      color: var(--green);
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
      box-sizing: border-box;
    }

    .upload-box:hover {
      background: #eaf1ec;
      transform: translateY(-1px);
    }

    .upload-box input {
      display: none;
    }

    .or-text {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .image-url-input {
      flex: 1;
      min-width: 220px;
    }

    .image-preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin-top: 10px;
      display: block;
    }

    .image-preview[hidden] {
      display: none;
    }


    /* =====================================================
       ADMIN ITEM CARDS
    ===================================================== */

    .admin-list-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .admin-list-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 9px;
      margin-bottom: 10px;
      display: block;
    }

    .admin-list-card h3 {
      margin: 5px 0;
    }

    .admin-list-card p {
      margin: 6px 0;
      color: var(--muted);
    }

    .admin-item-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .admin-item-actions button {
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .edit-btn {
      background: #1f86c9;
      color: #fff;
    }

    .edit-btn:hover {
      opacity: .85;
      transform: translateY(-1px);
    }

    .delete-btn {
      background: #dc3545;
      color: #fff;
    }

    .delete-btn:hover {
      opacity: .85;
      transform: translateY(-1px);
    }


    /* =====================================================
       EDIT MODAL
    ===================================================== */

    .edit-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
      overflow-y: auto;
    }

    .edit-modal[hidden] {
      display: none;
    }

    .edit-modal-card {
      width: 100%;
      max-width: 650px;
      background: #fff;
      border-radius: 16px;
      padding: 25px;
      box-sizing: border-box;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      max-height: 90vh;
      overflow-y: auto;
    }

    .edit-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .edit-modal-head h2 {
      margin: 0;
    }

    .modal-close {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #f1f1f1;
      color: #333;
      font-size: 20px;
      cursor: pointer;
      font-weight: 700;
    }

    .modal-close:hover {
      background: #ddd;
    }

    .edit-current-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin-top: 10px;
      display: block;
    }

    .edit-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .edit-modal-actions button {
      flex: 1;
      min-width: 130px;
    }

    .cancel-btn {
      background: #6c757d !important;
      color: #fff !important;
    }

    .cancel-btn:hover {
      opacity: .85;
    }

    .modal-section {
      margin-bottom: 16px;
    }

    .modal-section label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

        padding: 10px;
      }

        padding: 18px;
        max-height: 95vh;
      }

      .edit-current-image {
        height: 180px;
      }

    }

</head>

<script>

/* =====================================================
   IMAGE PREVIEW FROM COMPUTER
===================================================== */

function previewImage(input, previewId) {

  const preview =
    document.getElementById(previewId);

  if (!preview) return;


  if (
    !input.files ||
    !input.files[0]
  ) {

    preview.hidden = true;
    preview.src = "";

    return;
  }


  const file =
    input.files[0];


  if (
    !file.type.startsWith("image/")
  ) {

    alert(
      "Please select a valid image file."
    );

    input.value = "";

    preview.hidden = true;
    preview.src = "";

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      preview.src =
        e.target.result;

      preview.hidden =
        false;

    };


  reader.readAsDataURL(file);

}



/* =====================================================
   IMAGE PREVIEW FROM URL
===================================================== */

function previewUrl(input, previewId) {

  const preview =
    document.getElementById(previewId);

  if (!preview) return;


  const url =
    input.value.trim();


  if (!url) {

    preview.hidden = true;
    preview.src = "";

    return;
  }


  preview.src = url;

  preview.hidden = false;


  preview.onerror =
    function() {

      preview.hidden = true;

    };

}



/* =====================================================
   FILE TO DATA URL
===================================================== */

function fileToDataURL(file) {

  return new Promise(
    function(resolve,reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        function(error) {

          reject(error);

        };


      reader.readAsDataURL(file);

    }
  );

}



/* =====================================================
   ESCAPE TEXT
===================================================== */

function escapeAdminText(text) {

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   SAFE IMAGE URL
===================================================== */

function safeImage(image) {

  if (!image) {

    return "https://via.placeholder.com/600x400?text=No+Image";

  }

  return String(image)
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =====================================================
   ADD CATEGORY
===================================================== */

async function addCategory() {

  const name =
    document
      .getElementById("catName")
      .value
      .trim();


  const desc =
    document
      .getElementById("catDesc")
      .value
      .trim();


  const imageUrl =
    document
      .getElementById("catImage")
      .value
      .trim();


  const imageFile =
    document
      .getElementById("catImageFile")
      .files[0];


  if (!name) {

    alert(
      "Enter a category name."
    );

    return;
  }


  let image =
    imageUrl;


  if (imageFile) {

    try {

      image =
        await fileToDataURL(
          imageFile
        );

    } catch(error) {

      alert(
        "Unable to read the selected image."
      );

      return;
    }

  }


  if (!image) {

    image =
      "https://images.unsplash.com/photo-1544550285-f813152fb2f5?auto=format&fit=crop&w=900&q=80";

  }


  const s =
    loadStore();


  if (!s.categories) {

    s.categories = [];

  }


  const categoryId =
    slug(name) +
    "-" +
    Date.now()
      .toString()
      .slice(-6);


  s.categories.push({

    id: categoryId,

    name: name,

    desc: desc,

    image: image

  });


  saveStore(s);


  renderAdminCategories();

  renderAdminProducts();


  /* Clear */

  document
    .getElementById("catName")
    .value = "";


  document
    .getElementById("catDesc")
    .value = "";


  document
    .getElementById("catImage")
    .value = "";


  document
    .getElementById("catImageFile")
    .value = "";


  document
    .getElementById("catImagePreview")
    .hidden = true;


  document
    .getElementById("catImagePreview")
    .src = "";


  /* Update product category */

  populateProductCategories();


  alert(
    "Category added successfully."
  );

}



/* =====================================================
   ADD PRODUCT
===================================================== */

async function addProduct() {

  const name =
    document
      .getElementById("prodName")
      .value
      .trim();


  const category =
    document
      .getElementById("prodCategory")
      .value;


  const price =
    Number(
      document
        .getElementById("prodPrice")
        .value || 0
    );


  const imageUrl =
    document
      .getElementById("prodImage")
      .value
      .trim();


  const imageFile =
    document
      .getElementById("prodImageFile")
      .files[0];


  const sizes =
    document
      .getElementById("prodSize")
      .value
      .trim();


  const desc =
    document
      .getElementById("prodDesc")
      .value
      .trim();


  const stock =
    Number(
      document
        .getElementById("prodStock")
        .value || 0
    );


  if (!name) {

    alert(
      "Enter product name."
    );

    return;
  }


  if (!category) {

    alert(
      "Select a category."
    );

    return;
  }


  if (price < 0) {

    alert(
      "Price cannot be negative."
    );

    return;
  }


  if (stock < 0) {

    alert(
      "Stock cannot be negative."
    );

    return;
  }


  let image =
    imageUrl;


  if (imageFile) {

    try {

      image =
        await fileToDataURL(
          imageFile
        );

    } catch(error) {

      alert(
        "Unable to read the selected image."
      );

      return;
    }

  }


  if (!image) {

    image =
      "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=900&q=80";

  }


  const s =
    loadStore();


  if (!s.products) {

    s.products = [];

  }


  const productId =
    slug(name) +
    "-" +
    Date.now()
      .toString()
      .slice(-6);


  s.products.push({

    id: productId,

    name: name,

    category: category,

    price: price,

    image: image,

    sizes: sizes,

    desc: desc,

    stock: stock

  });


  saveStore(s);


  renderAdminProducts();


  /* Clear fields */

  document
    .getElementById("prodName")
    .value = "";


  document
    .getElementById("prodPrice")
    .value = "";


  document
    .getElementById("prodImage")
    .value = "";


  document
    .getElementById("prodImageFile")
    .value = "";


  document
    .getElementById("prodSize")
    .value = "";


  document
    .getElementById("prodDesc")
    .value = "";


  document
    .getElementById("prodStock")
    .value = "";


  document
    .getElementById("prodImagePreview")
    .hidden = true;


  document
    .getElementById("prodImagePreview")
    .src = "";


  alert(
    "Product added successfully."
  );

}



/* =====================================================
   POPULATE PRODUCT CATEGORIES
===================================================== */

function populateProductCategories() {

  const select =
    document.getElementById(
      "prodCategory"
    );


  if (!select) return;


  const s =
    loadStore();


  select.innerHTML = "";


  if (
    !s.categories ||
    s.categories.length === 0
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value = "";

    option.textContent =
      "Add a category first";

    select.appendChild(
      option
    );

    return;
  }


  const defaultOption =
    document.createElement(
      "option"
    );

  defaultOption.value = "";

  defaultOption.textContent =
    "Select category";

  select.appendChild(
    defaultOption
  );


  s.categories.forEach(
    function(category) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        category.id;

      option.textContent =
        category.name;

      select.appendChild(
        option
      );

    }
  );

}



/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderAdminCategories() {

  const list =
    document.getElementById(
      "categoryAdminList"
    );


  if (!list) return;


  const s =
    loadStore();


  if (
    !s.categories ||
    s.categories.length === 0
  ) {

    list.innerHTML = `

      <div class="form-card">

        <p class="small">
          No categories added yet.
        </p>

      </div>

    `;

    return;
  }


  list.innerHTML =
    s.categories
      .map(
        function(category) {

          return `

            <div
              class="admin-list-card"
            >

              <img
                src="${safeImage(category.image)}"
                alt="${escapeAdminText(category.name)}"
                onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
              >

              <h3>
                ${escapeAdminText(category.name)}
              </h3>

              <p>
                ${escapeAdminText(
                  category.desc ||
                  "No description"
                )}
              </p>


              <div
                class="admin-item-actions"
              >

                <button
                  class="edit-btn"
                  type="button"
                  onclick="editCategory('${category.id}')"
                >
                  ✏️ Edit
                </button>


                <button
                  class="delete-btn"
                  type="button"
                  onclick="deleteCategory('${category.id}')"
                >
                  🗑️ Delete
                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");

}



/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderAdminProducts() {

  const list =
    document.getElementById(
      "productAdminList"
    );


  if (!list) return;


  const s =
    loadStore();


  if (
    !s.products ||
    s.products.length === 0
  ) {

    list.innerHTML = `

      <div class="form-card">

        <p class="small">
          No products added yet.
        </p>

      </div>

    `;

    return;
  }


  list.innerHTML =
    s.products
      .map(
        function(product) {


          const category =
            (s.categories || [])
              .find(
                function(c) {

                  return c.id ===
                    product.category;

                }
              );


          return `

            <div
              class="admin-list-card"
            >

              <img
                src="${safeImage(product.image)}"
                alt="${escapeAdminText(product.name)}"
                onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
              >


              <h3>
                ${escapeAdminText(
                  product.name
                )}
              </h3>


              <p>
                Category:
                <strong>
                  ${escapeAdminText(
                    category
                      ? category.name
                      : "Unknown"
                  )}
                </strong>
              </p>


              <p>
                Price:
                <strong>
                  USD ${Number(
                    product.price || 0
                  ).toLocaleString()}
                </strong>
              </p>


              <p>
                Stock:
                <strong>
                  ${Number(
                    product.stock || 0
                  )}
                </strong>
              </p>


              <div
                class="admin-item-actions"
              >

                <button
                  class="edit-btn"
                  type="button"
                  onclick="editProduct('${product.id}')"
                >
                  ✏️ Edit
                </button>


                <button
                  class="delete-btn"
                  type="button"
                  onclick="deleteProduct('${product.id}')"
                >
                  🗑️ Delete
                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");

}



/* =====================================================
   DELETE CATEGORY
===================================================== */

function deleteCategory(id) {

  const s =
    loadStore();


  const category =
    (s.categories || [])
      .find(
        function(c) {

          return c.id === id;

        }
      );


  if (!category) {

    alert(
      "Category not found."
    );

    return;
  }


  const productsUsingCategory =
    (s.products || [])
      .filter(
        function(product) {

          return product.category === id;

        }
      );


  /*
    DO NOT DELETE A CATEGORY
    THAT STILL HAS PRODUCTS.
  */

  if (
    productsUsingCategory.length > 0
  ) {

    alert(
      "You cannot delete this category yet.\n\n" +
      productsUsingCategory.length +
      " product(s) are currently using this category.\n\n" +
      "Edit or delete those products first."
    );

    return;
  }


  const confirmed =
    confirm(
      'Delete category "' +
      category.name +
      '"?\n\n' +
      "This action cannot be undone."
    );


  if (!confirmed) return;


  s.categories =
    s.categories.filter(
      function(c) {

        return c.id !== id;

      }
    );


  saveStore(s);


  renderAdminCategories();

  renderAdminProducts();

  populateProductCategories();


  alert(
    "Category deleted successfully."
  );

}

/* =====================================================
   EDIT CATEGORY
===================================================== */

function editCategory(id) {

  const s =
    loadStore();


  const category =
    (s.categories || [])
      .find(
        function(c) {

          return c.id === id;

        }
      );


  if (!category) {

    alert(
      "Category not found."
    );

    return;
  }


  /* Set modal type */

  document
    .getElementById("editItemId")
    .value = id;


  document
    .getElementById("editItemType")
    .value = "category";


  /* Modal title */

  document
    .getElementById("editModalTitle")
    .textContent =
      "Edit Category";


  /* Name */

  document
    .getElementById("editName")
    .value =
      category.name || "";


  /* Description */

  document
    .getElementById("editDesc")
    .value =
      category.desc || "";


  /* Hide product fields */

  document
    .getElementById(
      "editCategoryWrapper"
    )
    .hidden = true;


  document
    .getElementById(
      "editPriceWrapper"
    )
    .hidden = true;


  document
    .getElementById(
      "editSizeWrapper"
    )
    .hidden = true;


  document
    .getElementById(
      "editStockWrapper"
    )
    .hidden = true;


  /* Image */

  document
    .getElementById("editImage")
    .value =
      category.image &&
      !category.image.startsWith("data:")
        ? category.image
        : "";


  document
    .getElementById("editImageFile")
    .value = "";


  const imagePreview =
    document.getElementById(
      "editImagePreview"
    );


  if (category.image) {

    imagePreview.src =
      category.image;

    imagePreview.hidden =
      false;

  } else {

    imagePreview.src = "";

    imagePreview.hidden =
      true;

  }


  /* Show modal */

  document
    .getElementById("editModal")
    .hidden = false;


  document.body.style.overflow =
    "hidden";

}



/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id) {

  const s =
    loadStore();


  const product =
    (s.products || [])
      .find(
        function(p) {

          return p.id === id;

        }
      );


  if (!product) {

    alert(
      "Product not found."
    );

    return;
  }


  /* Set modal information */

  document
    .getElementById("editItemId")
    .value = id;


  document
    .getElementById("editItemType")
    .value = "product";


  /* Title */

  document
    .getElementById("editModalTitle")
    .textContent =
      "Edit Product";


  /* Name */

  document
    .getElementById("editName")
    .value =
      product.name || "";


  /* Description */

  document
    .getElementById("editDesc")
    .value =
      product.desc || "";


  /* Price */

  document
    .getElementById("editPrice")
    .value =
      product.price || 0;


  /* Size */

  document
    .getElementById("editSize")
    .value =
      product.sizes || "";


  /* Stock */

  document
    .getElementById("editStock")
    .value =
      product.stock || 0;


  /* Show product fields */

  document
    .getElementById(
      "editCategoryWrapper"
    )
    .hidden = false;


  document
    .getElementById(
      "editPriceWrapper"
    )
    .hidden = false;


  document
    .getElementById(
      "editSizeWrapper"
    )
    .hidden = false;


  document
    .getElementById(
      "editStockWrapper"
    )
    .hidden = false;


  /* Load categories */

  const categorySelect =
    document.getElementById(
      "editCategory"
    );


  categorySelect.innerHTML = "";


  (s.categories || [])
    .forEach(
      function(category) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          category.id;

        option.textContent =
          category.name;

        if (
          category.id ===
          product.category
        ) {

          option.selected =
            true;

        }

        categorySelect.appendChild(
          option
        );

      }
    );


  /* Image */

  document
    .getElementById("editImage")
    .value =
      product.image &&
      !product.image.startsWith("data:")
        ? product.image
        : "";


  document
    .getElementById("editImageFile")
    .value = "";


  const imagePreview =
    document.getElementById(
      "editImagePreview"
    );


  if (product.image) {

    imagePreview.src =
      product.image;

    imagePreview.hidden =
      false;

  } else {

    imagePreview.src = "";

    imagePreview.hidden =
      true;

  }


  /* Show modal */

  document
    .getElementById("editModal")
    .hidden = false;


  document.body.style.overflow =
    "hidden";

}



/* =====================================================
   SAVE EDITED ITEM
===================================================== */

async function saveEditedItem() {

  const id =
    document
      .getElementById("editItemId")
      .value;


  const type =
    document
      .getElementById("editItemType")
      .value;


  const name =
    document
      .getElementById("editName")
      .value
      .trim();


  const desc =
    document
      .getElementById("editDesc")
      .value
      .trim();


  if (!name) {

    alert(
      "Name cannot be empty."
    );

    return;
  }


  const s =
    loadStore();


  /*
    =========================================
    EDIT CATEGORY
    =========================================
  */

  if (type === "category") {

    const category =
      (s.categories || [])
        .find(
          function(c) {

            return c.id === id;

          }
        );


    if (!category) {

      alert(
        "Category not found."
      );

      return;
    }


    category.name =
      name;


    category.desc =
      desc;


    /* Image */

    const imageFile =
      document
        .getElementById(
          "editImageFile"
        )
        .files[0];


    const imageUrl =
      document
        .getElementById(
          "editImage"
        )
        .value
        .trim();


    if (imageFile) {

      try {

        category.image =
          await fileToDataURL(
            imageFile
          );

      } catch(error) {

        alert(
          "Unable to read the selected image."
        );

        return;
      }

    } else if (imageUrl) {

      category.image =
        imageUrl;

    }


    saveStore(s);


    closeEditModal();


    renderAdminCategories();

    renderAdminProducts();

    populateProductCategories();


    alert(
      "Category updated successfully."
    );


    return;
  }



  /*
    =========================================
    EDIT PRODUCT
    =========================================
  */

  if (type === "product") {

    const product =
      (s.products || [])
        .find(
          function(p) {

            return p.id === id;

          }
        );


    if (!product) {

      alert(
        "Product not found."
      );

      return;
    }


    const category =
      document
        .getElementById(
          "editCategory"
        )
        .value;


    const price =
      Number(
        document
          .getElementById(
            "editPrice"
          )
          .value
      );


    const sizes =
      document
        .getElementById(
          "editSize"
        )
        .value
        .trim();


    const stock =
      Number(
        document
          .getElementById(
            "editStock"
          )
          .value
      );


    if (!category) {

      alert(
        "Please select a category."
      );

      return;
    }


    if (
      isNaN(price) ||
      price < 0
    ) {

      alert(
        "Please enter a valid price."
      );

      return;
    }


    if (
      isNaN(stock) ||
      stock < 0
    ) {

      alert(
        "Please enter a valid stock quantity."
      );

      return;
    }


    product.name =
      name;


    product.category =
      category;


    product.price =
      price;


    product.sizes =
      sizes;


    product.desc =
      desc;


    product.stock =
      stock;


    /* Image */

    const imageFile =
      document
        .getElementById(
          "editImageFile"
        )
        .files[0];


    const imageUrl =
      document
        .getElementById(
          "editImage"
        )
        .value
        .trim();


    if (imageFile) {

      try {

        product.image =
          await fileToDataURL(
            imageFile
          );

      } catch(error) {

        alert(
          "Unable to read the selected image."
        );

        return;
      }

    } else if (imageUrl) {

      product.image =
        imageUrl;

    }


    saveStore(s);


    closeEditModal();


    renderAdminProducts();


    alert(
      "Product updated successfully."
    );


    return;
  }

}



/* =====================================================
   CLOSE EDIT MODAL
===================================================== */

function closeEditModal() {

  const modal =
    document.getElementById(
      "editModal"
    );


  if (!modal) return;


  modal.hidden =
    true;


  document.body.style.overflow =
    "";


  /* Clear fields */

  document
    .getElementById("editItemId")
    .value = "";


  document
    .getElementById("editItemType")
    .value = "";


  document
    .getElementById("editName")
    .value = "";


  document
    .getElementById("editDesc")
    .value = "";


  document
    .getElementById("editPrice")
    .value = "";


  document
    .getElementById("editSize")
    .value = "";


  document
    .getElementById("editStock")
    .value = "";


  document
    .getElementById("editImage")
    .value = "";


  document
    .getElementById("editImageFile")
    .value = "";


  document
    .getElementById("editImagePreview")
    .src = "";


  document
    .getElementById("editImagePreview")
    .hidden = true;

}



/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

document
  .getElementById("editModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeEditModal();

      }

    }
  );



/* =====================================================
   ESC KEY CLOSES MODAL
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      const modal =
        document.getElementById(
          "editModal"
        );


      if (
        modal &&
        !modal.hidden
      ) {

        closeEditModal();

      }

    }

  }
);

   UPDATE LISTS
===================================================== */

function refreshAdminLists() {

  renderAdminCategories();

  renderAdminProducts();

  populateProductCategories();

}

   START ADMIN
   IMPORTANT:
   This is intentionally placed LAST so all custom
   functions above are already available.

  typeof initAdmin === "function"
) {

  initAdmin();

}

   Run our lists after the page has loaded.
*/

document.addEventListener(

    );
