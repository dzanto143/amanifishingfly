<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin | Amani Fishing Wholesale</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span>AMANI</span><small>FISHING WHOLESALE</small></a><button class="menu-btn" onclick="toggleMenu()">☰</button><nav id="mainNav"><a href="index.html">Storefront</a><a href="shop.html">Shop</a><a class="active" href="admin.html">Admin</a></nav></div></header>
<main class="section"><div class="container admin-wrap">
<div id="loginPanel" class="form-card narrow"><span class="eyebrow">STORE ADMIN</span><h1>Admin login</h1><input id="adminUser" class="input" placeholder="Username"><input id="adminPass" type="password" class="input" placeholder="Password"><button class="btn primary full" onclick="adminLogin()">Login</button><p class="small">Demo credentials: admin / amani123</p></div>
<div id="adminPanel" hidden><div class="admin-top"><div><span class="eyebrow">CONTROL CENTRE</span><h1>Manage your store</h1></div><button class="btn outline" onclick="adminLogout()">Log out</button></div>
<div class="admin-tabs"><button onclick="showAdminTab('categoriesAdmin')">Categories</button><button onclick="showAdminTab('productsAdmin')">Products</button><button onclick="showAdminTab('ordersAdmin')">Orders</button></div>
<div id="categoriesAdmin" class="admin-tab"><div class="admin-two"><div class="form-card"><h2>Add category</h2><input id="catName" class="input" placeholder="Category name"><input id="catDesc" class="input" placeholder="Short description"><input id="catImage" class="input" placeholder="Image URL"><button class="btn primary full" onclick="addCategory()">Add category</button></div><div id="categoryAdminList"></div></div></div>
<div id="productsAdmin" class="admin-tab" hidden><div class="admin-two"><div class="form-card"><h2>Add product</h2><input id="prodName" class="input" placeholder="Product name"><select id="prodCategory" class="input"></select><input id="prodPrice" class="input" type="number" placeholder="Price (KES)"><input id="prodImage" class="input" placeholder="Image URL"><input id="prodSize" class="input" placeholder="Sizes e.g. 8, 10, 12"><textarea id="prodDesc" class="input" placeholder="Product description"></textarea><input id="prodStock" class="input" type="number" placeholder="Stock quantity"><button class="btn primary full" onclick="addProduct()">Add product</button></div><div id="productAdminList"></div></div></div>
<div id="ordersAdmin" class="admin-tab" hidden><div id="ordersList"></div></div>
</div></div></main><footer><div class="copyright">© 2026 Amani Fishing Wholesale.</div></footer><script src="assets/app.js"></script><script>initAdmin();</script></body></html>
