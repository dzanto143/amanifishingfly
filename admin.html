<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin | Amani Fishing Wholesale</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .upload-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 12px 0 6px;
      color: var(--ink);
    }

    .image-options {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .upload-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px dashed var(--green2);
      border-radius: 9px;
      background: #f5f8f4;
      color: var(--green);
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
      box-sizing: border-box;
    }

    .upload-box:hover {
      background: #eaf1ec;
      transform: translateY(-1px);
    }

    .upload-box input {
      display: none;
    }

    .or-text {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .image-url-input {
      flex: 1;
      min-width: 220px;
    }

    .image-preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin-top: 10px;
      display: block;
    }

    .image-preview[hidden] {
      display: none;
    }

    .admin-item-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.admin-item-actions button {
  border: none;
  padding: 9px 14px;
  border-radius: 7px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s ease;
}

.edit-btn {
  background: #1f86c9;
  color: #fff;
}

.edit-btn:hover {
  opacity: 0.85;
}

.delete-btn {
  background: #dc3545;
  color: #fff;
}

.delete-btn:hover {
  opacity: 0.85;
}

.admin-list-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.admin-list-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 9px;
  margin-bottom: 10px;
}

.admin-list-card h3 {
  margin: 5px 0;
}

.admin-list-card p {
  margin: 5px 0;
  color: var(--muted);
}
  </style>
</head>

<body>

<header class="site-header">
  <div class="container nav">

    <a class="logo" href="index.html">
      <span>AMANI</span>
      <small>FISHING WHOLESALE</small>
    </a>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <nav id="mainNav">
      <a href="index.html">Storefront</a>
      <a href="shop.html">Shop</a>
      <a class="active" href="admin.html">Admin</a>
    </nav>

  </div>
</header>

<main class="section">
  <div class="container admin-wrap">

    <!-- LOGIN -->
    <div id="loginPanel" class="form-card narrow">

  <span class="eyebrow">STORE ADMIN</span>

  <h1>Admin login</h1>

  <input
    id="adminUser"
    class="input"
    placeholder="Username"
  >

  <input
    id="adminPass"
    type="password"
    class="input"
    placeholder="Password"
  >

  <button
    class="btn primary full"
    onclick="adminLogin()"
  >
    Login
  </button>

  <p class="small">
    Demo credentials: admin / amani123
  </p>

</div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel" hidden>

      <div class="admin-top">

        <div>
          <span class="eyebrow">CONTROL CENTRE</span>
          <h1>Manage your store</h1>
        </div>

        <button
          class="btn outline"
          onclick="adminLogout()"
        >
          Log out
        </button>

      </div> 


      <!-- ADMIN TABS -->
      <div class="admin-tabs">

        <button onclick="showAdminTab('categoriesAdmin')">
          Categories
        </button>

        <button onclick="showAdminTab('productsAdmin')">
          Products
        </button>

        <button onclick="showAdminTab('ordersAdmin')">
          Orders
        </button>

      </div>


      <!-- CATEGORIES -->
      <div id="categoriesAdmin" class="admin-tab">

        <div class="admin-two">

          <div class="form-card">

            <h2>Add category</h2>

            <input
              id="catName"
              class="input"
              placeholder="Category name"
            >

            <input
              id="catDesc"
              class="input"
              placeholder="Short description"
            >


            <!-- CATEGORY IMAGE -->
            <label class="upload-label">
              Category Image
            </label>

            <div class="image-options">

              <label class="upload-box">

                📁 Upload Image

                <input
                  id="catImageFile"
                  type="file"
                  accept="image/*"
                  onchange="previewImage(this, 'catImagePreview')"
                >

              </label>

              <span class="or-text">
                OR
              </span>

              <input
                id="catImage"
                class="input image-url-input"
                placeholder="Paste Image URL"
                oninput="previewUrl(this, 'catImagePreview')"
              >

            </div>

            <img
              id="catImagePreview"
              class="image-preview"
              hidden
              alt="Category image preview"
            >


            <button
              class="btn primary full"
              onclick="addCategory()"
            >
              Add category
            </button>

          </div>

          <div id="categoryAdminList"></div>

        </div>

      </div>


      <!-- PRODUCTS -->
      <div id="productsAdmin" class="admin-tab" hidden>

        <div class="admin-two">

          <div class="form-card">

            <h2>Add product</h2>

            <input
              id="prodName"
              class="input"
              placeholder="Product name"
            >

            <select
              id="prodCategory"
              class="input"
            ></select>

            <input
              id="prodPrice"
              class="input"
              type="number"
              placeholder="Price (USD)"
            >


            <!-- PRODUCT IMAGE -->
            <label class="upload-label">
              Product Image
            </label>

            <div class="image-options">

              <label class="upload-box">

                📁 Upload Image

                <input
                  id="prodImageFile"
                  type="file"
                  accept="image/*"
                  onchange="previewImage(this, 'prodImagePreview')"
                >

              </label>

              <span class="or-text">
                OR
              </span>

              <input
                id="prodImage"
                class="input image-url-input"
                placeholder="Paste Image URL"
                oninput="previewUrl(this, 'prodImagePreview')"
              >

            </div>

            <img
              id="prodImagePreview"
              class="image-preview"
              hidden
              alt="Product image preview"
            >


            <input
              id="prodSize"
              class="input"
              placeholder="Sizes e.g. 8, 10, 12"
            >

            <textarea
              id="prodDesc"
              class="input"
              placeholder="Product description"
            ></textarea>

            <input
              id="prodStock"
              class="input"
              type="number"
              placeholder="Stock quantity"
            >

            <button
              class="btn primary full"
              onclick="addProduct()"
            >
              Add product
            </button>

          </div>

          <div id="productAdminList"></div>

        </div>

      </div>


      <!-- ORDERS -->
      <div id="ordersAdmin" class="admin-tab" hidden>

        <div id="ordersList"></div>

      </div>

    </div>

  </div>
</main>


<footer>
  <div class="copyright">
    © 2026 Amani Fishing Wholesale.
  </div>
</footer>


<script src="app.js"></script>

<script>
  /*
    IMAGE PREVIEW FROM COMPUTER
  */
  function previewImage(input, previewId) {

    const preview = document.getElementById(previewId);

    if (!input.files || !input.files[0]) {
      preview.hidden = true;
      preview.src = "";
      return;
    }

    const file = input.files[0];

    if (!file.type.startsWith("image/")) {

      alert("Please select a valid image file.");

      input.value = "";

      preview.hidden = true;

      return;
    }

    const reader = new FileReader();

    reader.onload = function (e) {

      preview.src = e.target.result;

      preview.hidden = false;

    };

    reader.readAsDataURL(file);
  }


  /*
    IMAGE PREVIEW FROM URL
  */
  function previewUrl(input, previewId) {

    const preview = document.getElementById(previewId);

    const url = input.value.trim();

    if (!url) {

      preview.hidden = true;

      preview.src = "";

      return;
    }

    preview.src = url;

    preview.hidden = false;

    preview.onerror = function () {

      preview.hidden = true;

    };
  }


  /*
    CONVERT UPLOADED IMAGE TO DATA URL
    SO IT CAN BE SAVED WITH THE PRODUCT/CATEGORY
  */
  function fileToDataURL(file) {

    return new Promise((resolve, reject) => {

      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);

      reader.onerror = error => reject(error);

      reader.readAsDataURL(file);

    });

  }


  /*
    ADD CATEGORY
  */
  async function addCategory() {

    const name =
      document.getElementById("catName").value.trim();

    const desc =
      document.getElementById("catDesc").value.trim();

    const imageUrl =
      document.getElementById("catImage").value.trim();

    const imageFile =
      document.getElementById("catImageFile").files[0];


    if (!name) {

      alert("Enter a category name.");

      return;

    }


    let image = imageUrl;


    /*
      If an uploaded image exists,
      use the uploaded image instead of URL.
    */
    if (imageFile) {

      image = await fileToDataURL(imageFile);

    }


    /*
      Default image if nothing was provided.
    */
    if (!image) {

      image =
        "https://images.unsplash.com/photo-1544550285-f813152fb2f5?auto=format&fit=crop&w=900&q=80";

    }


    const s = loadStore();


    s.categories.push({

      id:
        slug(name) +
        "-" +
        Date.now().toString().slice(-4),

      name: name,

      desc: desc,

      image: image

    });


    saveStore(s);


    renderAdminCategories();

    renderAdminProducts();


    /*
      Clear fields
    */
    document.getElementById("catName").value = "";

    document.getElementById("catDesc").value = "";

    document.getElementById("catImage").value = "";

    document.getElementById("catImageFile").value = "";

    document.getElementById("catImagePreview").hidden = true;

    document.getElementById("catImagePreview").src = "";


    alert("Category added successfully.");

  }


  /*
    ADD PRODUCT
  */
  async function addProduct() {

    const name =
      document.getElementById("prodName").value.trim();

    const category =
      document.getElementById("prodCategory").value;

    const price =
      Number(
        document.getElementById("prodPrice").value || 0
      );


    const imageUrl =
      document.getElementById("prodImage").value.trim();

    const imageFile =
      document.getElementById("prodImageFile").files[0];


    const sizes =
      document.getElementById("prodSize").value;

    const desc =
      document.getElementById("prodDesc").value;

    const stock =
      Number(
        document.getElementById("prodStock").value || 0
      );


    if (!name) {

      alert("Enter product name.");

      return;

    }


    if (!category) {

      alert("Select a category.");

      return;

    }


    let image = imageUrl;


    /*
      If an uploaded image exists,
      use uploaded image instead of URL.
    */
    if (imageFile) {

      image = await fileToDataURL(imageFile);

    }


    /*
      Default product image.
    */
    if (!image) {

      image =
        "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=900&q=80";

    }


    const s = loadStore();


    s.products.push({

      id:
        slug(name) +
        "-" +
        Date.now().toString().slice(-4),

      name: name,

      category: category,

      price: price,

      image: image,

      sizes: sizes,

      desc: desc,

      stock: stock

    });


    saveStore(s);


    renderAdminProducts();


    /*
      Clear fields
    */
    document.getElementById("prodName").value = "";

    document.getElementById("prodPrice").value = "";

    document.getElementById("prodImage").value = "";

    document.getElementById("prodImageFile").value = "";

    document.getElementById("prodSize").value = "";

    document.getElementById("prodDesc").value = "";

    document.getElementById("prodStock").value = "";

    document.getElementById("prodImagePreview").hidden = true;

    document.getElementById("prodImagePreview").src = "";


    alert("Product added successfully.");

  }


  /*
    START ADMIN
  */
  initAdmin();

  /* ==========================================
   RENDER CATEGORIES WITH EDIT + DELETE
========================================== */

function renderAdminCategories() {

  const list = document.getElementById("categoryAdminList");

  if (!list) return;

  const s = loadStore();

  if (!s.categories || s.categories.length === 0) {

    list.innerHTML = `
      <div class="form-card">
        <p class="small">No categories added yet.</p>
      </div>
    `;

    return;
  }

  list.innerHTML = s.categories.map(category => `

    <div class="admin-list-card">

      <img
        src="${category.image}"
        alt="${escapeAdminText(category.name)}"
        onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
      >

      <h3>${escapeAdminText(category.name)}</h3>

      <p>
        ${escapeAdminText(category.desc || "No description")}
      </p>

      <div class="admin-item-actions">

        <button
          class="edit-btn"
          onclick="editCategory('${category.id}')"
        >
          ✏️ Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteCategory('${category.id}')"
        >
          🗑️ Delete
        </button>

      </div>

    </div>

  `).join("");
}


/* ==========================================
   RENDER PRODUCTS WITH EDIT + DELETE
========================================== */

function renderAdminProducts() {

  const list = document.getElementById("productAdminList");

  if (!list) return;

  const s = loadStore();

  if (!s.products || s.products.length === 0) {

    list.innerHTML = `
      <div class="form-card">
        <p class="small">No products added yet.</p>
      </div>
    `;

    return;
  }

  list.innerHTML = s.products.map(product => {

    const category = s.categories.find(
      c => c.id === product.category
    );

    return `

      <div class="admin-list-card">

        <img
          src="${product.image}"
          alt="${escapeAdminText(product.name)}"
          onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
        >

        <h3>
          ${escapeAdminText(product.name)}
        </h3>

        <p>
          Category:
          ${escapeAdminText(category ? category.name : "Unknown")}
        </p>

        <p>
          Price:
          $${Number(product.price || 0).toFixed(2)}
        </p>

        <p>
          Stock:
          ${product.stock || 0}
        </p>

        <div class="admin-item-actions">

          <button
            class="edit-btn"
            onclick="editProduct('${product.id}')"
          >
            ✏️ Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteProduct('${product.id}')"
          >
            🗑️ Delete
          </button>

        </div>

      </div>

    `;

  }).join("");
}


/* ==========================================
   DELETE CATEGORY
========================================== */

function deleteCategory(id) {

  const s = loadStore();

  const category = s.categories.find(
    c => c.id === id
  );

  if (!category) return;

  const productsUsingCategory = s.products.filter(
    p => p.category === id
  );

  let message =
    `Delete category "${category.name}"?`;

  if (productsUsingCategory.length > 0) {

    message +=
      `\n\nWarning: ${productsUsingCategory.length} product(s) use this category.`;

  }

  message +=
    `\n\nThis action cannot be undone.`;

  if (!confirm(message)) return;

  s.categories = s.categories.filter(
    c => c.id !== id
  );

  saveStore(s);

  renderAdminCategories();

  renderAdminProducts();

  alert("Category deleted successfully.");
}


/* ==========================================
   DELETE PRODUCT
========================================== */

function deleteProduct(id) {

  const s = loadStore();

  const product = s.products.find(
    p => p.id === id
  );

  if (!product) return;

  const confirmDelete = confirm(
    `Delete "${product.name}"?\n\nThis action cannot be undone.`
  );

  if (!confirmDelete) return;

  s.products = s.products.filter(
    p => p.id !== id
  );

  saveStore(s);

  renderAdminProducts();

  alert("Product deleted successfully.");
}


/* ==========================================
   EDIT CATEGORY
========================================== */

function editCategory(id) {

  const s = loadStore();

  const category = s.categories.find(
    c => c.id === id
  );

  if (!category) return;


  const newName = prompt(
    "Category name:",
    category.name
  );

  if (newName === null) return;

  const name = newName.trim();

  if (!name) {

    alert("Category name cannot be empty.");

    return;

  }


  const newDesc = prompt(
    "Category description:",
    category.desc || ""
  );

  if (newDesc === null) return;


  const newImage = prompt(
    "Category image URL:\n\nLeave unchanged by pressing Cancel.",
    category.image || ""
  );


  category.name = name;

  category.desc = newDesc.trim();

  if (newImage !== null && newImage.trim()) {

    category.image = newImage.trim();

  }


  saveStore(s);

  renderAdminCategories();

  renderAdminProducts();

  alert("Category updated successfully.");
}


/* ==========================================
   EDIT PRODUCT
========================================== */

function editProduct(id) {

  const s = loadStore();

  const product = s.products.find(
    p => p.id === id
  );

  if (!product) return;


  const newName = prompt(
    "Product name:",
    product.name
  );

  if (newName === null) return;

  if (!newName.trim()) {

    alert("Product name cannot be empty.");

    return;

  }


  const newPrice = prompt(
    "Price (USD):",
    product.price
  );

  if (newPrice === null) return;


  const price = Number(newPrice);

  if (isNaN(price) || price < 0) {

    alert("Please enter a valid price.");

    return;

  }


  const newSize = prompt(
    "Sizes:",
    product.sizes || ""
  );

  if (newSize === null) return;


  const newDesc = prompt(
    "Product description:",
    product.desc || ""
  );

  if (newDesc === null) return;


  const newStock = prompt(
    "Stock quantity:",
    product.stock || 0
  );

  if (newStock === null) return;


  const stock = Number(newStock);

  if (isNaN(stock) || stock < 0) {

    alert("Please enter a valid stock quantity.");

    return;

  }


  const newImage = prompt(
    "Product image URL:\n\nLeave unchanged by pressing Cancel.",
    product.image || ""
  );


  product.name = newName.trim();

  product.price = price;

  product.sizes = newSize.trim();

  product.desc = newDesc.trim();

  product.stock = stock;


  if (newImage !== null && newImage.trim()) {

    product.image = newImage.trim();

  }


  saveStore(s);

  renderAdminProducts();

  alert("Product updated successfully.");
}


/* ==========================================
   PROTECT TEXT INSERTED INTO HTML
========================================== */

function escapeAdminText(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
