<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AMANI Fishing Wholesale</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body class="admin-shell">
<div class="admin-top"><div class="container" style="display:flex;justify-content:space-between;align-items:center"><div class="logo" style="color:#fff">AMANI<span style="color:#d7a83e">FISHING WHOLESALE ADMIN</span></div><button id="logout" class="btn btn-light">Logout</button></div></div>
<main id="loginView" class="container section" style="max-width:520px"><div class="admin-panel"><h1>Admin Login</h1><div id="loginMessage"></div><form id="loginForm"><div class="form-group"><label>Email</label><input name="email" class="field" type="email" required></div><div class="form-group"><label>Password</label><input name="password" class="field" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:15px">Login</button></form></div></main>
<div id="adminView" style="display:none"><div class="admin-layout"><aside class="admin-sidebar"><button class="active" onclick="showTab('dashboard',this)">Dashboard</button><button onclick="showTab('categories',this)">Categories</button><button onclick="showTab('products',this)">Products</button><button onclick="showTab('orders',this)">Orders</button></aside><section class="admin-main">
<div id="dashboard" class="admin-tab"><div class="stat-grid"><div class="stat">Categories<strong id="statCats">0</strong></div><div class="stat">Products<strong id="statProducts">0</strong></div><div class="stat">Orders<strong id="statOrders">0</strong></div><div class="stat">Sales<strong id="statSales">$0.00</strong></div></div></div>
<div id="categories" class="admin-tab" style="display:none"><div class="admin-panel"><h2>Add / Edit Category</h2><form id="categoryForm"><input type="hidden" name="id"><div class="form-grid"><div class="form-group"><label>Name</label><input name="name" class="field" required></div><div class="form-group"><label>Image URL</label><input name="image_url" class="field" placeholder="Optional if uploading"></div><div class="form-group"><label>Upload Image</label><input name="image" class="field" type="file" accept="image/*"></div><div class="form-group full"><label>Description</label><textarea name="description" class="field"></textarea></div></div><button class="btn btn-primary">Save Category</button></form></div><div class="admin-panel"><h2>Categories</h2><div id="catList" class="admin-list"></div></div></div>
<div id="products" class="admin-tab" style="display:none"><div class="admin-panel"><h2>Add / Edit Product</h2><form id="productForm"><input type="hidden" name="id"><div class="form-grid"><div class="form-group"><label>Product name</label><input name="name" class="field" required></div><div class="form-group"><label>Category</label><select name="category_id" id="catSelect" class="field" required></select></div><div class="form-group"><label>Price (USD)</label><input name="price" class="field" type="number" min="0" step=".01" required></div><div class="form-group"><label>Stock</label><input name="stock" class="field" type="number" min="0" value="0"></div><div class="form-group"><label>Image URL</label><input name="image_url" class="field" placeholder="Optional if uploading"></div><div class="form-group"><label>Upload Image</label><input name="image" class="field" type="file" accept="image/*"></div><div class="form-group"><label>Sizes</label><input name="sizes" class="field" placeholder="#10, #12, #14, #16"></div><div class="form-group"><label><input name="featured" type="checkbox"> Featured product</label></div><div class="form-group full"><label>Description</label><textarea name="description" class="field"></textarea></div></div><button class="btn btn-primary">Save Product</button></form></div><div class="admin-panel"><h2>Products</h2><div id="productList" class="admin-list"></div></div></div>
<div id="orders" class="admin-tab"><div class="admin-panel"><h2>Orders</h2><div id="orderList" class="admin-list"></div></div></div>
</section></div></div>
<script>function showTab(id,btn){document.querySelectorAll('.admin-tab').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.admin-sidebar button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}</script>
<script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
