<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Checkout | AMANI Fishing Wholesale</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-config.js"></script>
    </head>
    <body>
        <div id="site-header"></div>
        <main class="section">
            <div class="container">
                <div class="section-head">
                    <div>
                        <div class="eyebrow">Order</div>
                        <h1>Checkout</h1>
                    </div>
                </div>
                <div id="orderMsg"></div>
                <div class="grid grid-2">
                    <div class="card card-body">
                        <h2>Your order</h2>
                        <div id="checkoutItems"></div>
                        <div style="display:flex;justify-content:space-between;margin-top:20px;font-size:22px;font-weight:900">
                            <span>Total</span>
                            <span id="checkoutTotal">$0.00</span>
                        </div>
                    </div>
                    <form id="checkoutForm" class="card card-body">
                        <h2>Delivery details</h2>
                        <div class="form-group">
                            <label>Full name</label>
                            <input name="customer_name" class="field" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input name="phone" class="field" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input name="email" class="field" type="email">
                        </div>
                        <div class="form-group">
                            <label>Delivery address</label>
                            <textarea name="address" class="field" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <textarea name="notes" class="field"></textarea>
                        </div>
                        <button class="btn btn-primary" style("width:100%")>Place Order</button>
                    </form>
                </div>
            </div>
        </main>
        <div id="site-footer"></div>
        <script src="app.js"></script>
        <script src="checkout.js"></script>
    </body>
</html>
