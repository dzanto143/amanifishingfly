<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Shop | AMANI Fishing Wholesale</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-config.js"></script>
    </head>
    <body>
        <div id="site-header"></div>
        <main class="section">
            <div class="container">
                <div class="section-head">
                    <div>
                        <div class="eyebrow">Catalogue</div>
                        <h1>Shop Fishing Flies</h1>
                        <p class="muted">Find the right pattern for your next fishing trip.</p>
                    </div>
                </div>
                <div class="filters">
                    <input id="shopSearch" class="field" placeholder="Search flies...">
                    <select id="shopCategory" class="field"></select>
                </div>
                <div id="shopGrid" class="grid grid-4"></div>
            </div>
        </main>
        <div id="site-footer"></div>
        <script src="app.js"></script>
    </body>
</html>
