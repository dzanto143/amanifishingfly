<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shop | Amani Fishing Wholesale</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="container nav">
                <a class="logo" href="index.html">
                    <span>AMANI</span>
                    <small>FISHING WHOLESALE</small>
                </a>
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
                <nav id="mainNav">
                    <a href="index.html">Home</a>
                    <a class="active" href="shop.html">Shop</a>
                    <a href="categories.html">Categories</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                    <a class="cart-link" href="cart.html">Cart <b id="cartCount">0</b></a>
                    <a class="admin-link" href="admin.html">Admin</a>
                </nav>
            </div>
        </header>

        <main>
            <section class="page-hero">
                <div class="container">
                    <span class="eyebrow">AMANI SHOP</span>
                    <h1>Fishing flies & supplies</h1>
                    <p>Browse our collection and order the quantities you need.</p>
                </div>
            </section>

            <section class="section">
                <div class="container">
                    <div class="shop-tools">
                        <input id="search" class="input" placeholder="Search products..." oninput="renderShop()">
                        <select id="categoryFilter" class="input" onchange="renderShop()">
                            <option value="">All categories</option>
                        </select>
                    </div>
                    <div id="shopGrid" class="product-grid"></div>
                </div>
            </section>
        </main>

        <footer>
            <div class="copyright">
                © 2026 Amani Fishing Wholesale.
            </div>
        </footer>

        <script src="app.js"></script>
        <script>initShop();</script>
    </body>
</html>
